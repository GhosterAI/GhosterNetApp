appId: com.ghosternet.app
productName: GhosterNet
electronLanguages:
  - en-US
  - ru
directories:
  buildResources: build
files:
  - '!**/.vscode/*'
  - '!src/*'
  - '!ph/*'
  - '!aur/*'
  - '!images/*'
  - '!scripts/*'
  - '!extra/*'
  - '!tailwind.config.js'
  - '!postcss.config.js'
  - '!electron.vite.config.{js,ts,mjs,cjs}'
  - '!{.eslintignore,.eslintrc.cjs,.prettierignore,.prettierrc.yaml,dev-app-update.yml,CHANGELOG.md,README.md}'
  - '!{.env,.env.*,.npmrc,pnpm-lock.yaml}'
  - '!{tsconfig.json,tsconfig.node.json,tsconfig.web.json}'
extraResources:
  - from: './resources/'
    to: ''
    filter:
      - '**/*'
      - '!**/.git/**'
      - '!**/.github/**'
      - '!**/.gitignore'
      - '!**/.gitattributes'
      - '!**/README.md'
      - '!**/LICENSE.txt'
protocols:
  name: 'GhosterNet URI Scheme'
  schemes:
    - 'ghosternet'
    - 'tg-ws'
win:
  target:
    - nsis
    - 7z
  artifactName: ${productName}_${arch}-portable.${ext}
  requestedExecutionLevel: requireAdministrator
nsis:
  artifactName: ${productName}_${arch}.${ext}
  uninstallDisplayName: ${productName}
  allowToChangeInstallationDirectory: true
  oneClick: false
  perMachine: true
  createDesktopShortcut: true
  include: build/nsis/installer.nsh
mac:
  target:
    - pkg
  hardenedRuntime: true
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  notarize: false
  extendInfo:
    - NSCameraUsageDescription: Application requests access to the device's camera.
    - NSMicrophoneUsageDescription: Application requests access to the device's microphone.
    - NSDocumentsFolderUsageDescription: Application requests access to the user's Documents folder.
    - NSDownloadsFolderUsageDescription: Application requests access to the user's Downloads folder.
  artifactName: ${productName}_${arch}.${ext}
pkg:
  allowAnywhere: false
  allowCurrentUserHome: false
linux:
  desktop:
    entry:
      Name: GhosterNet
      MimeType: 'x-scheme-handler/ghosternet;x-scheme-handler/tg-ws'
  target:
    - deb
    - rpm
    - pacman
  maintainer: GhosterAI
  category: Utility
  artifactName: ${productName}_${arch}.${ext}
deb:
  afterInstall: 'build/linux/postinst'
rpm:
  afterInstall: 'build/linux/postinst'
pacman:
  afterInstall: 'build/linux/postinst'
  artifactName: ${productName}_${arch}.pkg.tar.xz
npmRebuild: true
publish: []
